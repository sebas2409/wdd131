<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket Form</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta name="author" content="Juan Sebastian Gonzalez">
    <meta name="description" content="Event Ticket Form">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h2>Event Ticket</h2>
    <form id="ticketForm">
        <div class="row">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" name="type" required>
                    <option value="">Choose one</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>
                </select>
            </div>
            <div class="form-group">
                <label for="eventDate">Event Date</label>
                <input type="date" id="eventDate" name="eventDate" required>
            </div>
        </div>

        <div id="dynamicSection" class="form-group hidden">
            <label id="dynamicLabel" for="dynamicInput">Student I#</label>
            <input type="text" id="dynamicInput" name="dynamicInput">
        </div>

        <button type="submit">Create Ticket</button>
    </form>

    <div id="errors" class="error-messages"></div>

    <div id="successDisplay" class="success-message hidden">
        <h3>Ticket Created</h3>
        <p id="outName"></p>
        <p id="outType"></p>
        <p id="outDate"></p>
    </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
