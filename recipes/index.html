<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Juan Sebastian Gonzalez">
    <meta name="description"
          content="Discover the best recipes, including our easy and delicious Apple Crisp fall dessert.">
    <meta name="keywords" content="recipes, dessert, apple crisp, baking, food, recipe book">
    <title>RecipeBook - Apple Crisp</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook - Apple Crisp">
    <meta property="og:description"
          content="Discover the best recipes, including our easy and delicious Apple Crisp fall dessert.">
    <meta property="og:url" content="">
    <meta property="og:image" content="social-preview-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RecipeBook - Apple Crisp">
    <meta name="twitter:description"
          content="Discover the best recipes, including our easy and delicious Apple Crisp fall dessert.">
    <meta name="twitter:image" content="social-preview-image.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <div class="logo">
        <img height="100" src="https://wddbyui.github.io/wdd131/images/recipe1/recipe-book.png"
             alt="Logo of a recipe book with a red cover and a white heart on it">
        <h1>RECIPEBOOK</h1>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Find a recipe">
        <button id="searchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>
</header>
<main>
    <article class="recipe-card">
        <div class="recipe-image-container">
            <img
                 id="recipe-image"
                 alt="Apple Crisp in a white bowl">
        </div>
        <div class="recipe-content">
            <div class="tag-container">
                <span class="tag">dessert</span>
            </div>
            <h2 id="recipe-name">APPLE CRISP</h2>
            <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>
            <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served
                warm with vanilla ice cream.</p>
        </div>
    </article>
</main>
<footer>
    <div class="social-icons">
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" aria-label="Pinterest"><i class="fa-brands fa-pinterest-p"></i></a>
    </div>
    <div class="footer-links">
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik -
            Flaticon</a>
    </div>
</footer>
<script src="script.js"></script>
</body>
</html>
