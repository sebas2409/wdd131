<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="A character card component built with HTML and CSS.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Juan Sebastian Gonzalez">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Put Page Title Here">
    <meta property="og:description" content="Put Page Description Here">
    <meta property="og:url" content="https://yourURLofPage.here">
    <meta property="og:image" content="https://yourURLofSocialPreviewImageHere.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Put Page Title Here">
    <meta name="twitter:description" content="Put Page Description Here">
    <meta name="twitter:image" content="https://yourURLofSocialPreviewImageHere.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">
    <title>Character Card Component | Juan Sebastian Gonzalez</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="card">
    <img class="image" src="https://andejuli.github.io/wdd131/character_card/snortleblat.webp" alt="Character Image">
    <div class="name" id="charName"></div>
    <div class="stats">
        <p><strong>Class:</strong> <span id="charClass"></span></p>
        <p><strong>Level:</strong> <span id="charLevel"></span></p>
        <p><strong>Health:</strong> <span id="charHealth"></span></p>
    </div>
    <div class="buttons">
        <button onclick="character.attacked()">Attacked</button>
        <button onclick="character.levelUp()">Level Up</button>
    </div>
</div>
</body>
</html>
